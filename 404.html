<!doctype html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 62.5%; }
        body {
            font-family: 'Minecraft', 'Montserrat', sans-serif;
            background: linear-gradient(rgba(0, 30, 70, 0.9), rgba(0, 20, 50, 0.95)), url("imports/fondo2.jpg") center/cover no-repeat fixed;

        p { font-size: 1.8rem; color: rgba(255, 255, 255, 0.7); margin-bottom: 3rem; }
        a {
            display: inline-block;
            padding: 1.2rem 3rem;
            background: rgba(102, 163, 255, 0.15);

            color: #66a3ff;
            text-decoration: none;
            font-size: 1.6rem;
            transition: background 0.3s;
        }
        a:hover { background: rgba(102, 163, 255, 0.25); }
