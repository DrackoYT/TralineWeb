<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><title>Redirigiendo...</title></head>
<body>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var state = params.get('state');
  var storedState = sessionStorage.getItem('discord_oauth_state');
  var verifier = sessionStorage.getItem('discord_code_verifier');
  var originalPage = sessionStorage.getItem('discord_original_page') || '/lore.html';
  var clientId = sessionStorage.getItem('discord_client_id');

  if (!code || !state || state !== storedState || !verifier || !clientId) {
    sessionStorage.removeItem('discord_oauth_state');
    sessionStorage.removeItem('discord_code_verifier');
    sessionStorage.removeItem('discord_original_page');
    sessionStorage.removeItem('discord_client_id');
    window.location.href = originalPage;
    return;
  }

  fetch('https://discord.com/api/oauth2/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      client_id: clientId,
      grant_type: 'authorization_code',
      code: code,
      redirect_uri: window.location.origin + '/discord-callback.html',
      code_verifier: verifier
    })
  }).then(function (r) { return r.json(); }).then(function (data) {
    if (!data.access_token) throw new Error('No access_token');
    return fetch('https://discord.com/api/users/@me', {
      headers: { Authorization: 'Bearer ' + data.access_token }
    }).then(function (r) { return r.json(); });
  }).then(function (user) {
    sessionStorage.setItem('discord_auth_result', JSON.stringify({
      id: user.id,
      email: user.email || '',
      name: user.global_name || user.username,
      avatar: user.avatar ? 'https://cdn.discordapp.com/avatars/' + user.id + '/' + user.avatar + '.png' : ''
    }));
  }).catch(function (err) {
    console.error('Discord auth error:', err);
  }).then(function () {
    sessionStorage.removeItem('discord_oauth_state');
    sessionStorage.removeItem('discord_code_verifier');
    sessionStorage.removeItem('discord_original_page');
    sessionStorage.removeItem('discord_client_id');
    window.location.href = originalPage;
  });
})();
</script>
</body>
</html>
